name: Check Minis

on:
  push:
    branches: [punovia/increased-memory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup update stable
          rustup target add --toolchain stable aarch64-unknown-linux-musl
      - name: Test and build
        working-directory: minis
        run: |
          cargo +stable test --locked
          export CC_aarch64_unknown_linux_musl=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static"
          cargo +stable build --locked --release --target aarch64-unknown-linux-musl
          bin=target/aarch64-unknown-linux-musl/release/siboot
          readelf -h "$bin" | grep -q AArch64
          ! readelf -l "$bin" | grep -q INTERP
          "$bin" --help
      - name: Save the ARM64 test build
        uses: actions/upload-artifact@v4
        with:
          name: siboot-minis-arm64-test
          path: minis/target/aarch64-unknown-linux-musl/release/siboot
          if-no-files-found: error
          retention-days: 1
